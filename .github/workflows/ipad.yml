# Builds the iPad app in the cloud.
#  1. Linux runner: Unity exports the Xcode project (cheap minutes).
#  2. macOS runner: Xcode compiles it into an UNSIGNED .ipa (sign + install it with Sideloadly / AltStore using your Apple ID).
# Needs repository secrets: UNITY_LICENSE (contents of Unity_lic.ulf), UNITY_EMAIL, UNITY_PASSWORD.
name: Build iPad

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  unity-ios:
    name: Unity -> Xcode project
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-iOS-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: iOS
          unityVersion: auto
          buildName: QianFoShan
      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: build/iOS
          retention-days: 3

  xcode:
    name: Xcode -> unsigned ipa
    needs: unity-ios
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: xcode
      - name: Build unsigned app
        run: |
          PROJ=$(find xcode -name "Unity-iPhone.xcodeproj" -maxdepth 3 | head -1)
          echo "project: $PROJ"
          xcodebuild -project "$PROJ" -scheme Unity-iPhone -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO build | tail -40
          APP=$(find dd/Build/Products -name "*.app" -maxdepth 3 | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry QianFoShan-unsigned.ipa Payload
          ls -la QianFoShan-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: QianFoShan-iPad
          path: QianFoShan-unsigned.ipa
          retention-days: 14
