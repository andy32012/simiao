# Builds the iPad app in the cloud.
# The Xcode project is exported by Unity on the developer's Windows machine (QF > Build iOS) and uploaded as
# xcode-project.zip to a GitHub release. This workflow only runs Xcode on a macOS runner, so no Unity licence or
# account secrets are needed here. The result is an UNSIGNED .ipa: sign + install it with Sideloadly / AltStore.
name: Build iPad

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag that holds xcode-project.zip"
        required: true
        default: "ios-latest"

permissions:
  contents: write

jobs:
  xcode:
    name: Xcode -> unsigned ipa
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Download Xcode project
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "xcode-project.zip"
          mkdir -p xcode && ditto -x -k xcode-project.zip xcode
          # zips made on Windows lose the executable bit
          find xcode \( -name "*.sh" -o -name "MapFileParser" -o -name "usymtool*" \) -exec chmod +x {} \; || true
          ls xcode | head
          xcodebuild -version
          # Sideloading tools (AltServer, Sideloadly) turn the app name into an Apple "App ID" name, which must be ASCII.
          # Keep the Info.plist name in English and give Chinese iPads the real name through InfoPlist.strings (added after the build).
          PL=xcode/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName QianFoShan" "$PL"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleLocalizations" "$PL" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleLocalizations array" -c "Add :CFBundleLocalizations: string en" -c "Add :CFBundleLocalizations: string zh-Hant" -c "Add :CFBundleLocalizations: string zh-Hans" -c "Add :CFBundleLocalizations: string zh-HK" "$PL"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" -c "Print :CFBundleLocalizations" "$PL"

      - name: Build unsigned app
        run: |
          PROJ=$(find xcode -name "Unity-iPhone.xcodeproj" -maxdepth 3 | head -1)
          echo "project: $PROJ"
          xcodebuild -project "$PROJ" -scheme Unity-iPhone -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO build > build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | head -60 || true
          grep -q "BUILD SUCCEEDED" build.log
          APP=$(find dd/Build/Products -name "*.app" -maxdepth 3 | head -1)
          rm -rf Payload && mkdir -p Payload && cp -R "$APP" Payload/
          APPDIR=$(find Payload -maxdepth 1 -name "*.app" | head -1)
          for L in zh-Hant zh-Hans zh-HK; do
            mkdir -p "$APPDIR/$L.lproj"
            printf '"CFBundleDisplayName" = "霧鎖千佛山";\n"CFBundleName" = "霧鎖千佛山";\n' > "$APPDIR/$L.lproj/InfoPlist.strings"
          done
          mkdir -p "$APPDIR/en.lproj"
          printf '"CFBundleDisplayName" = "QianFoShan";\n' > "$APPDIR/en.lproj/InfoPlist.strings"
          plutil -lint "$APPDIR/zh-Hant.lproj/InfoPlist.strings"
          zip -qry QianFoShan-iPad.ipa Payload
          ls -la QianFoShan-iPad.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: build.log
          retention-days: 7

      - name: Attach ipa to the release
        run: gh release upload "$TAG" QianFoShan-iPad.ipa -R "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: QianFoShan-iPad
          path: QianFoShan-iPad.ipa
          retention-days: 14
